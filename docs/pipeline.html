<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benchmark pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; display: flex; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · causal-ci-benchmark</p>
    <h1>Benchmark pipeline</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 368" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc">
        <title id="pipeline-title">Benchmark pipeline</title>
        <desc id="pipeline-desc">Synthetic graphs and a structural causal model generator feed experiments 1 and 2, real datasets feed experiment 3, and the six compared conditional independence tests are run in all three experiments.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first, behind the nodes -->
        <line x1="232" y1="112" x2="280" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M480 100 H496 Q504 100 504 92 V72 Q504 64 512 64 H528" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M480 124 H496 Q504 124 504 132 V152 Q504 160 512 160 H528" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="232" y1="304" x2="528" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="784" y1="64" x2="736" y2="64" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="784" y1="160" x2="736" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="784" y1="304" x2="736" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Inputs -->
        <rect x="32" y="80" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="44" y="98" fill="#4f5d75" font-size="7.5" font-weight="500" letter-spacing="0.18em" font-family="'Geist Mono', monospace">SYNTHETIC GRAPHS</text>
        <text x="44" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Graph topologies</text>
        <text x="44" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">4 structures · ER · bnlearn</text>

        <rect x="32" y="272" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="44" y="290" fill="#4f5d75" font-size="7.5" font-weight="500" letter-spacing="0.18em" font-family="'Geist Mono', monospace">REAL DATA</text>
        <text x="44" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Data + reference DAGs</text>
        <text x="44" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Sachs · Auto MPG · APM</text>

        <!-- Generator -->
        <rect x="280" y="80" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="292" y="98" fill="#4f5d75" font-size="7.5" font-weight="500" letter-spacing="0.18em" font-family="'Geist Mono', monospace">GENERATOR</text>
        <text x="292" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">SCM data generator</text>
        <text x="292" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">5 model families · mixed types</text>

        <!-- Experiments -->
        <rect x="528" y="32" width="208" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="540" y="50" fill="#4f5d75" font-size="7.5" font-weight="500" letter-spacing="0.18em" font-family="'Geist Mono', monospace">EXPERIMENT 1</text>
        <text x="540" y="70" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Fundamental structures</text>
        <text x="540" y="86" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">2 CI decisions → structure</text>

        <rect x="528" y="128" width="208" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="540" y="146" fill="#4f5d75" font-size="7.5" font-weight="500" letter-spacing="0.18em" font-family="'Geist Mono', monospace">EXPERIMENT 2</text>
        <text x="540" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Structure recovery</text>
        <text x="540" y="182" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">PC-stable → CPDAG</text>

        <rect x="528" y="272" width="208" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="540" y="290" fill="#4f5d75" font-size="7.5" font-weight="500" letter-spacing="0.18em" font-family="'Geist Mono', monospace">EXPERIMENT 3</text>
        <text x="540" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Graph falsification</text>
        <text x="540" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">dagitty statements · Holm</text>

        <!-- Focal: the compared CI tests -->
        <rect x="784" y="32" width="184" height="304" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="800" y="54" fill="#bf4520" font-size="7.5" font-weight="500" letter-spacing="0.18em" font-family="'Geist Mono', monospace">COMPARED</text>
        <text x="800" y="76" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">6 CI tests</text>
        <text font-size="10" fill="#2d3142" font-family="'Geist Mono', monospace">
          <tspan x="800" y="112">KCI</tspan>
          <tspan x="800" y="136">GCM</tspan>
          <tspan x="800" y="160">CMIknn</tspan>
          <tspan x="800" y="184">Mixed CI</tspan>
          <tspan x="800" y="208">Fisher-Z</tspan>
          <tspan x="800" y="232">Pearson χ²</tspan>
        </text>
        <line x1="800" y1="268" x2="952" y2="268" stroke="rgba(191,69,32,0.30)" stroke-width="1"/>
        <text x="800" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">parity-tested against</text>
        <text x="800" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">causal-learn, tigramite</text>
        <text x="800" y="318" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">and R packages</text>
      </svg>
    </div>
  </div>
</body>
</html>
